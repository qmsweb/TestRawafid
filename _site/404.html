  .rawafid-loader-dots span {

    background: var(--rawafid-primary, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
  }

  .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
  .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes rawafid-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes rawafid-dot-pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }

</style>

<div id="rawafid-loading-overlay" role="status" aria-live="polite" aria-label="جاري التحميل">
  <div class="rawafid-loader-spinner"></div>
  <div class="rawafid-loader-text">
    جاري التحميل
    <span class="rawafid-loader-dots">
      <span></span><span></span><span></span>
    </span>
  </div>
</div>

<script>
  (function () {
    var overlay = document.getElementById('rawafid-loading-overlay');

    var hidden = false;        /* هل الشاشة مخفية بالفعل */
    var pinned = false;        /* بعد إظهارها يدوياً: تخفى فقط بطلب صريح */
    var loadDone = (document.readyState === 'complete');
    var pendingFetches = 0;    /* عدد عمليات جلب البيانات الجارية */

    function forceHide() {
      hidden = true;
      if (overlay) overlay.classList.add('hidden');
    }

    /* الإخفاء لا يتم إلا بعد اكتمال حدث load وانتهاء كل عمليات الجلب الجارية */
    function tryHide() {
      if (!hidden && !pinned && loadDone && pendingFetches <= 0) forceHide();
    }

    window.rawafidHideLoader = function () {
      pinned = false;
      tryHide();
    };

    window.rawafidShowLoader = function () {
      pinned = true;
      hidden = false;
      if (overlay) overlay.classList.remove('hidden');
    };

    if (!loadDone) {
      window.addEventListener('load', function () {
        loadDone = true;
        tryHide();
      });
    }

    /* تتبع طلبات fetch الصادرة من الصفحة: تبقى شاشة التحميل ظاهرة حتى تنتهي آخر عملية جلب بيانات */
    if (typeof window.fetch === 'function') {
      var originalFetch = window.fetch;
      window.fetch = function () {
        var request;
        pendingFetches += 1;
        try {
          request = originalFetch.apply(this, arguments);
        } catch (err) {
          pendingFetches -= 1;
          tryHide();
          throw err;
        }
        if (request && typeof request.then === 'function') {
          request.then(release, release);
        } else {
          release();
        }
        return request;

        function release() {
          pendingFetches -= 1;
          tryHide();
        }
      };
    }

    /* أمان: إخفاء شاشة التحميل إلزامياً بعد 6 ثوانٍ حتى لو فشل أي سكربت */
    setTimeout(forceHide, 6000);

    /* إخفاء فوري عند التنقل ذهاباً/إياباً من ذاكرة المتصفح */
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) forceHide();
    });
  })();
</script>

<script>
  /* التقاط النقر قبل تحميل سكربت اللوحة (defer)، خصوصًا على iPad.
     يمنع انتقال الرابط إلى /ibn-faris/ إذا سبق النقرُ تحميلَ السكربت. */
  (function () {
    "use strict";

    function elementFrom(target) {
      if (!target) return null;
      if (target.nodeType === 1) return target;
      return target.parentElement || null;
    }

    function triggerFrom(target) {
      var element = elementFrom(target);
      return element && element.closest
        ? element.closest("[data-if-open]")
        : null;
    }

    document.addEventListener(
      "click",
      function (event) {
        if (event.defaultPrevented) return;

        var trigger = triggerFrom(event.target);
        if (!trigger) return;

        if (
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();

        if (
          window.IbnFarisSheet &&
          typeof window.IbnFarisSheet.open === "function"
        ) {
          window.IbnFarisSheet.open(trigger);
          return;
        }

        // السكربت لم يجهز بعد: نحتفظ بالطلب ونفتح اللوحة فور جاهزيته.
        window.__ibnFarisPendingOpen = trigger;
        window.setTimeout(function () {
          if (window.__ibnFarisPendingOpen !== trigger) return;
          window.__ibnFarisPendingOpen = null;
          var href = trigger.getAttribute("href");
          if (href) window.location.href = href;
        }, 8000);
      },
      true
    );
  })();
</script>
