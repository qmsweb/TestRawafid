- title: "اختبار في الدرس الثالث: النقد الانطباعي (التأثري)"
  subject-name: النقد الحديث
  subject-code: ARAB417
  questions:
    - type: instructions
      mainTitle: "أولًا: الأسئلة الموضوعية (اختيار من متعدد)"
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة وفقاً لما درسته في الدرس الثالث
    - type: mcq
      question: "ما الموقع الذي ينزله الدرس للمنهج الانطباعي بين المناهج النقدية؟"
      points: 1
      choices:
        - منهج يعيد الاعتبار للتجربة الجمالية المباشرة وحرية التذوق الذاتي
        - منهج يخضع النص لمعايير علمية خارجية صارمة
        - منهج يرد النص إلى سياقه التاريخي والاجتماعي وحده
        - منهج يلغي دور الناقد ويقتصر على تحليل البنية
      answer: منهج يعيد الاعتبار للتجربة الجمالية المباشرة وحرية التذوق الذاتي
    - type: mcq
      question: "لماذا يوصف المنهج الانطباعي بأنه أقدم منهج نقدي عرفه التاريخ البشري؟"
      points: 1
      choices:
        - لأنه نشأ في القرن التاسع عشر مع الحركة التشكيلية
        - لأنه ارتبط ببديهة الإنسان وانفعاله الأول أمام العمل الفني
        - لأنه اعتمد على القواعد العروضية والنحوية
        - لأنه استند إلى المناهج التاريخية والاجتماعية
      answer: لأنه ارتبط ببديهة الإنسان وانفعاله الأول أمام العمل الفني
    - type: mcq
      question: "يقوم تعريف المنهج الانطباعي على وصف:"
      points: 1
      choices:
        - الإحساسات والانطباعات التي تتركها قراءة النص في نفس الناقد
        - البنية اللغوية للنص وعلاقات ألفاظه الداخلية
        - السياق التاريخي الذي انبثق فيه النص
        - القواعد العروضية التي يخضع لها النص
      answer: الإحساسات والانطباعات التي تتركها قراءة النص في نفس الناقد
    - type: mcq
      question: "ما المصطلحات التي يعدها الدرس متكاملة الدلالات مع مصطلح النقد الانطباعي؟"
      points: 1
      choices:
        - البنيوي والسميائي والتفكيكي واللساني
        - التاريخي والاجتماعي والثقافي والبيئي
        - العروضي والنحوي والبلاغي والمعجمي
        - التأثري والذاتي والذوقي والانفعالي
      answer: التأثري والذاتي والذوقي والانفعالي
    - type: mcq
      question: "ما مضمون ركن الصدق في النقد التأثري؟"
      points: 1
      choices:
        - مطابقة الحكم لمعايير أكاديمية سابقة
        - نقل المشاعر الحقيقية دون تزييف أو مبالغة تتصادم مع الذوق العفوي
        - إحصاء الظواهر الأسلوبية في النص إحصاءً دقيقاً
        - إخضاع النص لقواعد المنطق الصارم
      answer: نقل المشاعر الحقيقية دون تزييف أو مبالغة تتصادم مع الذوق العفوي
    - type: mcq
      question: "ما الأصل التاريخي الذي تنسب إليه الانطباعية في الدرس؟"
      points: 1
      choices:
        - حركة تشكيلية في باريس بين 1874 و1886 أحدثت قطيعة مع الأكاديمية
        - مدرسة لغوية في فيينا اهتمت ببنية النصوص
        - تيار فلسفي في أثينا عُنِي بمنطق الشعر
        - حركة نقدية في القاهرة تأسست عام 1948
      answer: حركة تشكيلية في باريس بين 1874 و1886 أحدثت قطيعة مع الأكاديمية
    - type: mcq
      question: "لوحة «انطباع» التي منحت الحركة اسمها رسمها:"
      points: 1
