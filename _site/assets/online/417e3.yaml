    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح
    - type: essay
      question: "حلل أركان النقد التأثري الثلاثة، وبيّن كيف يحقق كل ركن مشروعية منهجية للنقد الانطباعي."
      points: 4
      answer: "1- الصدق: نقل المشاعر الحقيقية التي تولدت أثناء القراءة دون تزييف أو مبالغة، فيكون الحكم صادقاً عن تجربة فعلية. 2- التعبير عن المشاعر: النص مرآة تعكس عواطف الناقد، فالنقد التأثري «أدب على أدب» يعبر عن الحزن أو الدهشة أو المتعة. 3- النظرة الخاصة للحياة: انطلاق الناقد من خلفيته الثقافية وتجاربه ورؤيته للكون والحياة في تفسير النص والحكم عليه. 4- الحصيلة: الأركان تحول الانطباع من مزاج عابر إلى تجربة موثقة الصدق ومنسوبة إلى صاحبها، فتضبط الذاتية من داخلها."
    - type: essay
      question: "ركّب حجة تبيّن انتقال الانطباعية من الفن التشكيلي إلى النقد الأدبي، وموقعها في السجال العربي حول الذوق والعلم."
      points: 4
      answer: "1- النشأة التشكيلية: حركة باريس في الربع الأخير من القرن التاسع عشر وثمانية معارض أحدثت قطيعة مع الأكاديمية، وهدفها اقتناص الانطباعات البصرية العابرة. 2- التسمية والانتقال: لوحة «انطباع» لكلود موني التي عرضت في «قاعة المرفوض»، ثم انتقالها إلى الأدب مع أدباء طليعيين ككونكور سعوا لنقل الظلال الدقيقة للإحساس بلغة تضحي بالنحو والألفاظ غير الملونة. 3- الموقع النقدي: جاءت رد فعل على المناهج السياقية التي طمست القيم الجمالية، وتأثرت بنظرية «الفن للفن» والنظرية الوجدانية. 4- السجال العربي: معركة مندور وزكي نجيب محمود حول العلم والذوق، وانتهت عند مندور إلى الجمع بين مرحلة تأثيرية ومرحلة تعليل موضوعي."
    - type: essay
      question: "قوّم الحكم القائل إن «النقد الانطباعي نقد غير علمي لا قيمة له»، مبيناً ما يمنحه المشروعية النظرية وما يحدّ من صلاحيته."
      points: 4
      answer: "1- عرض الحكم: يبني أصحابه حكمهم على غياب الضوابط الموحدة ووقوع النقد في الذاتية وتضارب الأحكام. 2- ما يمنحه المشروعية: كونه أقدم منهج نقدي ارتبط ببديهة الإنسان وانفعاله الأول، وقيامه على الصدق في نقل المشاعر، وعلى ركن النظرة الخاصة للحياة، واتصاله برصيد تراثي عربي وغربي. 3- ما يحدّ من صلاحيته: الذاتية المفرطة، وإشاعة الفوضى النقدية، والعدول عن النص إلى الذات، وإهمال التركيب الباطن للعمل الأدبي. 4- الحكم المتزن: الحكم مبالغ في إطلاقه؛ فالانطباعية ليست علمًا بالمعنى الصارم لكنها لحظة تأسيسية لا يستغني عنها النقد، وغايتها القصوى أن تُدمج في مرحلة تأثيرية تليها مرحلة تفسير وتعليل موضوعي."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
