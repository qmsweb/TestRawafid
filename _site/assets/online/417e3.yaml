      answer: جول لومتر
    - type: mcq
      question: "من أول من استعان بأسس النقد التأثري من النقاد العرب المحدثين حسب الدرس؟"
      points: 1
      choices:
        - محمد مندور
        - طه حسين
        - يحيى حقي
        - إيليا الحاوي
      answer: طه حسين
    - type: mcq
      question: "كيف قسم زكي نجيب محمود العملية النقدية في سجاله مع مندور؟"
      points: 1
      choices:
        - مرحلة لغوية ومرحلة بلاغية
        - مرحلة ذوق يختار المادة ومرحلة عقل يحلل ويعلل
        - مرحلة تاريخية ومرحلة نفسية
        - مرحلة وصفية ومرحلة إحصائية
      answer: مرحلة ذوق يختار المادة ومرحلة عقل يحلل ويعلل
