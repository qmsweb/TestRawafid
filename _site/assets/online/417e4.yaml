- title: "اختبار في الدرس الرابع: مناهج النقد السياقي"
  subject-name: النقد الحديث
  subject-code: ARAB417
  questions:
    - type: instructions
      mainTitle: "أولًا: الأسئلة الموضوعية (اختيار من متعدد)"
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة وفقاً لما درسته في الدرس الرابع
    - type: mcq
      question: "نشأت مناهج النقد السياقي في القرن التاسع عشر وبدايات العشرين بوصفها:"
      points: 1
      choices:
        - امتداداً طبيعياً للنقد الذوقي والانفعالي
        - حركة تشكيلية انتقلت من الرسم إلى الأدب
        - ردة فعل مباشرة على النقد الانطباعي والذاتي والتأثري
        - تجديداً داخلياً في قواعد العروض والبلاغة
      answer: ردة فعل مباشرة على النقد الانطباعي والذاتي والتأثري
    - type: mcq
      question: "على أي شيء يعتمد النقد السياقي في مقاربة النص الإبداعي؟"
      points: 1
      choices:
        - المؤثرات الخارجية المحيطة بالعمل وشبكة علاقاته بسياق نشأته
        - البنية الداخلية للنص وعلاقات ألفاظه
        - انطباعات القارئ الأولى أمام النص
        - الخصائص الصوتية والإيقاعية للغة النص
      answer: المؤثرات الخارجية المحيطة بالعمل وشبكة علاقاته بسياق نشأته
    - type: mcq
      question: "ما أهمية مصطلح «منظم» في تعريف النقد السياقي؟"
      points: 1
      choices:
        - يجعل النقد فرعاً من فروع علم الأحياء
        - ينقل النقد من الانطباعية الذوقية إلى المنهجية العلمية
        - يلغي الحاجة إلى قراءة النص قراءة مباشرة
        - يقصر النقد على دراسة حياة المؤلف وحدها
      answer: ينقل النقد من الانطباعية الذوقية إلى المنهجية العلمية
    - type: mcq
      question: "أي الأسئلة التالية لا يعد من الأسئلة المنهجية التي يطرحها الناقد السياقي؟"
      points: 1
      choices:
        - ما صلة النص بالطبقة الاجتماعية وبالمؤسسات الاقتصادية والسياسية؟
        - ما مدى تأثير العمل الإبداعي في ذات مبدعه وفي جمهور المتلقين؟
        - ما نسبة العمل الإبداعي إلى صاحبه التاريخي؟
        - ما علاقة الإيقاع الداخلي للقصيدة ببنيتها الصوتية في ذاتها؟
      answer: ما علاقة الإيقاع الداخلي للقصيدة ببنيتها الصوتية في ذاتها؟
    - type: mcq
      question: "ما مضمون الأساس التجريبي في النقد السياقي (هيوم، لوك، هوبز، ليسينغ)؟"
      points: 1
      choices:
        - نقل شروط التجربة العلمية من علوم المادة والأحياء إلى الأدب
        - إخضاع الأدب لمقولات المنطق الصوري الأرسطي
        - تفسير الأدب بالأساطير والطوطم والسحر
        - رد الأدب إلى صراع الطبقات والبنية التحتية
      answer: نقل شروط التجربة العلمية من علوم المادة والأحياء إلى الأدب
    - type: mcq
      question: "كيف تنظر الفلسفة الوضعية (أوغست كونت) إلى الأدب؟"
      points: 1
      choices:
        - بوصفه تعبيراً مقنعاً عن رغبات مكبوتة
        - بوصفه انفعالاً ذاتياً محضاً لا يخضع لقانون
        - بوصفه نتيجة أسباب غير أدبية محددة دائماً من الخارج
        - بوصفه التزاماً حراً يعبر عن صراعات المجتمع
      answer: بوصفه نتيجة أسباب غير أدبية محددة دائماً من الخارج
    - type: mcq
      question: "ما إسهام التحليل النفسي الفرويدي في الأسس الفلسفية للنقد السياقي؟"
      points: 1
      choices:
        - اعتبار الأدب مرآة للعلاقات الإنتاجية والاجتماعية
        - استعارة اللاشعور والتداعي الحر والأحلام في تفسير الإبداع
        - اعتبار الإنسان والحضارة نظاماً تطورياً يخضع لقوانين موضوعية
        - إحلال الذوق الفردي محل المناهج العلمية
      answer: استعارة اللاشعور والتداعي الحر والأحلام في تفسير الإبداع
    - type: mcq
      question: "تقوم الفلسفات الاجتماعية والماركسية في النقد السياقي على:"
      points: 1
      choices:
        - مفهوم الالتزام والحرية في الوجودية
        - مفهوم النموذج الأعلى في الأنثروبولوجيا
        - نظرية الحواس والملاحظة في الفلسفة التجريبية
        - نظرية الانعكاس والعلاقة الجدلية بين البنية التحتية والبنية الفوقية
      answer: نظرية الانعكاس والعلاقة الجدلية بين البنية التحتية والبنية الفوقية
    - type: mcq
      question: "أي أبعاد تعامل النقد السياقي مع النص يعبر عن «سلب الاستقلالية الذاتية»؟"
      points: 1
      choices:
        - النص بوصفه عينة مخبرية قابلة للقياس
        - النص بوصفه تنظيمًا ثقافيًا اجتماعيًا
        - النص بوصفه نتيجة لأسباب غير أدبية
        - النص بوصفه وثيقة وسجلاً لبيئته
      answer: النص بوصفه نتيجة لأسباب غير أدبية
    - type: mcq
      question: "إلى أي أصل فكري ترجع المناهج السياقية الثلاثة في خاتمة الدرس؟"
      points: 1
      choices:
        - الفلسفات الوضعية والتجريبية
        - النظريات الجمالية الذاتية
        - البلاغة العربية القديمة
        - النقد الانطباعي الفرنسي
      answer: الفلسفات الوضعية والتجريبية
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية
    - type: tf
      question: "يُعد النقد السياقي امتداداً مباشراً للنقد الانطباعي في اعتماده على الذوق الفردي."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يرى النقد السياقي أن النص بنية معزولة عن بيئته لا تتأثر بها."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "في بعد تقطيع النص إلى شكل ومحتوى يصرف الناقد السياقي نظره عن الشكل لصالح المضمون."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "رفدت الفلسفة الوجودية النقدَ السياقي بمفهومي الالتزام والحرية."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "تتعامل الفلسفة الوضعية مع النص بوصفه عينة قابلة للملاحظة والقياس والتفسير الخارجي."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "تخلص دراسة محمد عروس إلى أن النقد السياقي ضرب من الاستحسان الذاتي المنظم."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح
    - type: essay
      question: "حلل الأسس الفلسفية التي يستند إليها النقد السياقي، مبيناً كيف أطّر كل أساس تصور النص وموقع الأديب."
      points: 4
      answer: "1- التجريبية والوضعية: الحواس والملاحظة والتجربة ونقل شروطها إلى الأدب، مع رد الأدب إلى أسباب غير أدبية محددة من الخارج. 2- التحليل النفسي: اللاشعور والتداعي الحر والأحلام، والأدب تعبير مقنع عن رغبات مكبوتة. 3- الاجتماعية والماركسية والوجودية: نظرية الانعكاس والجدل بين البنية التحتية والفوقية، ثم الالتزام والحرية واعتبار الأديب قائداً فكرياً. 4- الأنثروبولوجيا والتطورية: السحر والطوطم والأسطورة والنموذج الأعلى، والإنسان والحضارة نظام تطوري يخضع لقوانين موضوعية."
    - type: essay
      question: "ركّب تصوراً متكاملاً لأبعاد تعامل النقد السياقي مع النص عند محمد عروس، وبيّن المنطق الداخلي الذي يربط بينها."
      points: 4
      answer: "1- النص عينة مخبرية: يُنظر إليه بوصفه عينة تحت مجهر تتسع عدسته إلى ما هو خارج العمل، قابلة للملاحظة والقياس. 2- النص تنظيم ثقافي اجتماعي: ينتمي إلى سياق تاريخي يؤثر فيه ويتأثر به، والمؤثرات الخارجية سبيل لفهمه. 3- النص نتيجة أسباب غير أدبية ويُقطَّع إلى شكل ومحتوى: لا يستقل بذاته، ويُصرف النظر عن الشكل ويُقلَّب في المضمون بحثاً عن مواد اجتماعية وتاريخية وأيديولوجية. 4- النص وثيقة وسجل: تُقرأ التجربة الإبداعية انعكاساً للواقع النفسي والاجتماعي والتاريخي، والمنطق الجامع هو الانتقال من الاستحسان الذاتي إلى المقاربة العلمية المنظمة."
    - type: essay
      question: "قوّم الحكم القائل إن النقد السياقي «يسلب النص استقلاليته الذاتية»، مع بيان المكسب المنهجي لهذا الاتجاه وحدوده."
      points: 4
      answer: "1- مضمون الحكم ووجاهته: النقد السياقي يرد النص إلى أسباب خارجية ويجعله نتيجة أسباب غير أدبية، فيفقد استقلاله، وهو ما ينص عليه البعد الثالث في دراسة عروس. 2- المكسب المنهجي: نقل النقد من الانطباعية إلى المنهجية، وضبط الأحكام، وإضاءة النص من الخارج عبر شبكة علاقاته. 3- الحدود: إهمال الشكل الأدبي والتركيب الباطن، وخطر اختزال الأدب في وثيقة أو عينة قياس. 4- التقييم: الحكم صحيح وصفاً لا حكماً نهائياً؛ فالاستقلال النسبي للنص يبقى شرطاً لئلا يذوب الأدب في علومه المساعدة."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
