<body class="if-page">
  <a class="if-skip" href="#if-main">تخطَّ إلى المحادثة</a>

  <div class="if-page-stage">
    <div class="if-sheet if-sheet--page" role="dialog" aria-modal="true" aria-labelledby="if-title">
      <div class="if-app" id="if-app" data-icon="/images/ibnfaris-icon.png">
  <span class="if-sheet-handle" aria-hidden="true"></span>

  <h1 class="if-sr-only" id="if-title">ابن فارس — مساعد روافد اللغوي</h1>

  <header class="if-topbar">
    <div class="if-brand" aria-label="ابن فارس">
      <span class="if-brand-mark" aria-hidden="true">
        <img src="/images/ibnfaris-icon.png" alt="" width="28" height="28" />
      </span>
      <span class="if-brand-text">
        <span class="if-brand-name">ابن فارس</span>
        <span class="if-brand-sub">مساعد روافد اللغوي</span>
      </span>
    </div>

    <div class="if-topbar-actions">
      <button class="if-circle if-circle--accent" id="if-new" type="button" aria-label="محادثة جديدة" title="محادثة جديدة">
        <svg class="if-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
      </button><a class="if-circle" href="/" aria-label="إغلاق ابن فارس والعودة إلى روافد" title="إغلاق">
        <svg class="if-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </a><div class="if-quota-ring" id="if-quota" role="img" aria-label="الحصة اليومية المتبقية">
        <svg viewBox="0 0 42 42" aria-hidden="true">
          <circle class="if-quota-track" cx="21" cy="21" r="18" pathLength="100"></circle>
          <circle class="if-quota-value" id="if-quota-value" cx="21" cy="21" r="18" pathLength="100"></circle>
        </svg>
      </div>
    </div>
  </header>

  <main class="if-main" id="if-main">
    <div class="if-thread" id="if-thread">
      <section class="if-empty" id="if-empty" aria-labelledby="if-empty-title">
        <span class="if-empty-mark" aria-hidden="true">
          <img src="/images/ibnfaris-icon.png" alt="" width="34" height="34" />
        </span>
        <h2 class="if-empty-title" id="if-empty-title">كيف أساعدك في لغتك؟</h2>
        <p class="if-empty-text">
          اسأل عن الإعراب أو الصرف أو المعاجم أو البلاغة، وسيجيبك ابن فارس
          مستعيناً بكتب العربية.
        </p>

        <div class="if-suggestions">
          <button class="if-suggestion" type="button" data-prompt="أعرب: «وَاللَّهُ غَالِبٌ عَلَى أَمْرِهِ» إعراباً كاملاً مع ذكر القاعدة.">
            <span class="if-suggestion-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                <path d="M8 7h8"></path>
                <path d="M8 11h5"></path>
              </svg>
            </span>
            <span class="if-suggestion-title">أعرب آية</span>
            <span class="if-suggestion-desc">«وَاللَّهُ غَالِبٌ عَلَى أَمْرِهِ»</span>
          </button>

          <button class="if-suggestion" type="button" data-prompt="ما الفرق بين الحال والتمييز؟ اشرح الفرق بمثالين وأذكر المصدر.">
            <span class="if-suggestion-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3 4 7l4 4"></path>
                <path d="M4 7h12a4 4 0 0 1 0 8h-2"></path>
                <path d="m16 21 4-4-4-4"></path>
                <path d="M20 17H8a4 4 0 0 1 0-8h2"></path>
              </svg>
            </span>
            <span class="if-suggestion-title">فرق لغوي</span>
            <span class="if-suggestion-desc">الحال والتمييز بمثالين</span>
          </button>

          <button class="if-suggestion" type="button" data-prompt="زِن كلمة «استخراج» واذكر أصلها ووزنها الصرفي مع الشرح.">
            <span class="if-suggestion-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v18"></path>
                <path d="M5 7h14"></path>
                <path d="m5 7-2 5a3 3 0 0 0 6 0z"></path>
                <path d="m19 7-2 5a3 3 0 0 0 6 0z"></path>
              </svg>
            </span>
            <span class="if-suggestion-title">ميزان صرفي</span>
            <span class="if-suggestion-desc">زِن كلمة «استخراج»</span>
          </button>

          <button class="if-suggestion" type="button" data-prompt="ما الفرق بين الضاد والظاء في النطق والكتابة؟ أعطني أمثلة عملية.">
            <span class="if-suggestion-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <path d="M8 9h8"></path>
                <path d="M8 13h5"></path>
              </svg>
            </span>
            <span class="if-suggestion-title">الضاد والظاء</span>
            <span class="if-suggestion-desc">فرق النطق والكتابة</span>
          </button>
        </div>
      </section>

      <div class="if-messages" id="if-messages" aria-live="polite"></div>
    </div>
  </main>

  <div class="if-composer-shell">
    <div class="if-composer-width">
      <div class="if-alert" id="if-alert" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v5"></path>
          <path d="M12 16.5h.01"></path>
        </svg>
        <span id="if-alert-text"></span>
      </div>

      <form class="if-composer" id="if-form" autocomplete="off">
        <label class="if-sr-only" for="if-input">سؤالك إلى ابن فارس</label>
        <textarea
          class="if-input"
          id="if-input"
          name="message"
          rows="1"
          maxlength="4000"
          placeholder="اسأل عن إعراب، صرف، معجم أو بلاغة..."
        ></textarea>

        <div class="if-composer-actions">
          <button class="if-stop" id="if-stop" type="button" hidden>
            <span class="if-stop-square" aria-hidden="true"></span>
            <span class="if-sr-only">إيقاف</span>
          </button>
          <button class="if-send" id="if-send" type="submit" aria-label="إرسال السؤال" title="إرسال">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5"></path>
              <path d="m5 12 7-7 7 7"></path>
            </svg>
          </button>
        </div>
      </form>

      <p class="if-disclaimer">
        <strong>ابن فارس</strong> قد يخطئ؛ تحقّق من المصادر. لا نحفظ محادثاتك.
      </p>
    </div>
  </div>
</div>

  </div>
