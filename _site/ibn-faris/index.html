<body class="if-page">
  <a class="if-skip" href="#if-main">تخطَّ إلى المحادثة</a>

  <div class="if-page-stage">
    <div class="if-sheet if-sheet--page">
      <div class="if-app" id="if-app">
  <span
    class="if-sheet-handle"
    aria-hidden="true"
  ></span>

  <h1 class="if-sr-only" id="if-title">ابن فارس</h1>

  <header class="if-topbar">
    <div class="if-brand" aria-label="ابن فارس">
      <span class="if-brand-mark" aria-hidden="true">
        <img src="/images/ibnfaris-icon.png" alt="" width="28" height="28" />
      </span>
      <span class="if-brand-text">
        <span class="if-brand-name">ابن فارس</span>
      </span>
    </div>

    <div class="if-topbar-actions">
      <div class="if-quota-ring" id="if-quota" role="img" aria-label="الحصة اليومية المتبقية">
        <svg viewBox="0 0 42 42" aria-hidden="true">
          <circle class="if-quota-track" cx="21" cy="21" r="18" pathLength="100"></circle>
          <circle class="if-quota-value" id="if-quota-value" cx="21" cy="21" r="18" pathLength="100"></circle>
        </svg>
        <span class="if-quota-count" id="if-quota-count" aria-hidden="true">…</span>
      </div>

      <button class="if-circle if-circle--accent" id="if-new" type="button" aria-label="محادثة جديدة" title="محادثة جديدة">
        <svg class="if-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
      </button><a class="if-circle" id="if-close" href="/" aria-label="إغلاق ابن فارس والعودة إلى روافد" title="إغلاق">
        <svg class="if-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </a></div>
  </header>

  <main class="if-main" id="if-main" tabindex="-1">
    <div class="if-thread" id="if-thread">
      <section class="if-empty" id="if-empty" aria-labelledby="if-empty-title">
        <span class="if-empty-mark" aria-hidden="true">
          <img src="/images/ibnfaris-icon.png" alt="" width="34" height="34" />
        </span>
        <h2 class="if-empty-title" id="if-empty-title">ابدأ بالسؤال</h2>
        <div class="if-suggestions" id="if-suggestions">
          <button class="if-suggestion" type="button" data-if-suggest="أعرب: «جاء الطالبُ مجتهدًا»">
            إعراب مثال
          </button>
          <button class="if-suggestion" type="button" data-if-suggest="ما وزن كلمة «استخراج» وما أصلها؟">
            وزن صرفي
          </button>
          <button class="if-suggestion" type="button" data-if-suggest="لخّص درس مهارة الاستماع في مقرر EDUC432">
            تلخيص درس
          </button>
          <button class="if-suggestion" type="button" data-if-suggest="ما متطلبات مقرر النحو 2 وترتيبه في الخطة؟">
            متطلبات مقرر
          </button>
        </div>
        <p class="if-empty-hint">
          أسأل عن النحو والصرف والبلاغة والأدب، وعن مقررات روافد وخطتها، وعن التربية والتعليم وسلطنة عمان.
        </p>
      </section>

      <div class="if-messages" id="if-messages"></div>
      <div class="if-sr-only" id="if-live" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
  </main>

  <div class="if-composer-shell">
    <button class="if-jump" id="if-jump" type="button" tabindex="-1" aria-label="العودة إلى آخر الرد">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14"></path>
        <path d="m19 12-7 7-7-7"></path>
      </svg>
      <span>آخر الرد</span>
    </button>

    <div class="if-confirm" id="if-confirm" role="alertdialog" aria-modal="false" aria-labelledby="if-confirm-text" hidden>
      <p class="if-confirm-text" id="if-confirm-text">سيتم حذف المحادثة الحالية. هل تريد المتابعة؟</p>
      <div class="if-confirm-actions">
        <button class="if-confirm-cancel" id="if-confirm-cancel" type="button">إلغاء</button>
        <button class="if-confirm-ok" id="if-confirm-ok" type="button">حذف المحادثة</button>
      </div>
    </div>

    <div class="if-composer-width">
      <div class="if-alert" id="if-alert" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v5"></path>
          <path d="M12 16.5h.01"></path>
        </svg>
        <span id="if-alert-text"></span>
      </div>

      <form class="if-composer" id="if-form" autocomplete="off">
        <label class="if-sr-only" for="if-input">سؤالك إلى ابن فارس</label>
        <textarea
          class="if-input"
          id="if-input"
          name="message"
          rows="1"
          maxlength="4000"
          placeholder="اسأل"
        ></textarea>

        <div class="if-composer-actions">
          <button class="if-stop" id="if-stop" type="button" hidden>
            <span class="if-stop-square" aria-hidden="true"></span>
            <span class="if-sr-only">إيقاف</span>
          </button>
          <button class="if-send" id="if-send" type="submit" aria-label="إرسال السؤال" title="إرسال">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5"></path>
              <path d="m5 12 7-7 7 7"></path>
            </svg>
          </button>
        </div>
      </form>

      <p class="if-disclaimer">
        <strong>ابن فارس</strong> قد يخطئ؛ تحقّق من المصادر.
        <span class="if-disclaimer-sub">
          تُحفظ المحادثة في هذا التبويب فقط حتى إغلاقه.
          <a href="/ibn-faris/sources/">المصادر والترخيص</a>
        </span>
      </p>
    </div>
  </div>

  <script>
    // إذا وصل المستخدم من الزر العائم، يعيده زر الإغلاق إلى الصفحة السابقة
    // بدل الصفحة الرئيسية. نرفض المسارات الخارجية (//example.com).
    (function () {
      var params = new URLSearchParams(window.location.search);
      var from = params.get("from") || "";
      if (
        !from ||
        from.charAt(0) !== "/" ||
        from.charAt(1) === "/" ||
        from.indexOf("\\") !== -1
      ) {
        return;
      }

      var close = document.getElementById("if-close");
      if (close) close.setAttribute("href", from);
    })();
