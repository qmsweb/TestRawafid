- title: "اختبار في الدرس الأول: النقد الأدبي الحديث"
  subject-name: النقد الحديث
  subject-code: ARAB417
  questions:
    - type: instructions
      mainTitle: "أولًا: الأسئلة الموضوعية (اختيار من متعدد)"
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة وفقاً لما درسته في الدرس الأول
    - type: mcq
      question: "تكمن القيمة الجوهرية للنقد الأدبي — حسب الدرس — في قدرته على:"
      points: 1
      choices:
        - وضع قواعد ثابتة لتصنيف الأجناس الأدبية وترتيبها
        - الحكم النهائي على قيمة الأعمال وترتيبها في سلم جمالي
        - تفكيك النصوص وتحليلها من مناظير متعددة وبناء جسور الفهم
        - إحصاء السمات الأسلوبية المشتركة في النصوص القديمة
      answer: تفكيك النصوص وتحليلها من مناظير متعددة وبناء جسور الفهم
    - type: mcq
      question: "المنهج الذي يوضح كيف يمكن للأدب أن يكون تجسيداً دقيقاً للبنية المجتمعية والتحولات الثقافية هو المنهج:"
      points: 1
      choices:
        - الاجتماعي
        - النفسي
        - البنيوي
        - الجمالي
      answer: الاجتماعي
    - type: mcq
      question: "ما الفارق الذي يعقده الدرس بين النقد بوصفه حكماً على جودة النص والنقد بوصفه منهجاً تحليلياً شاملاً؟"
      points: 1
      choices:
        - الأول يقتصر على الشعر، والثاني يشمل السرد والمسرح
        - الثاني يستغني عن فحص العناصر الهيكلية والتقنية للنص
        - الأول يلزم القارئ بذوق الجماعة، والثاني يحرره من كل معيار
        - الثاني يزاوج التحليل الدقيق والبحث عن المعاني المتوارية
      answer: الثاني يزاوج التحليل الدقيق والبحث عن المعاني المتوارية
    - type: mcq
      question: "تضع المدارس الكلاسيكية والتقليدية تركيزها الأساس على:"
      points: 1
      choices:
        - المؤثرات الاجتماعية والثقافية المحيطة بالعمل
        - المكونات الداخلية للعمل كالحبكة وتطور الشخصيات ونمط السرد
        - تمثيل النوع الاجتماعي وعلاقات السلطة في النص
        - العلاقة بين الأدب والبيئة والتمثلات الطبيعية
      answer: المكونات الداخلية للعمل كالحبكة وتطور الشخصيات ونمط السرد
    - type: mcq
      question: "ما السمة التي يميز بها الدرس منهج النقد الجديد في تصنيفه للمدارس؟"
      points: 1
      choices:
        - قراءة النصوص بنحو مستقل عن المؤثرات والسياقات الخارجية
        - إخضاع النص لمعايير أخلاقية سابقة على القراءة
        - رد النص إلى سيرة المؤلف ودوافعه النفسية
        - تفسير النص بوصفه مرآة للصراع الطبقي في المجتمع
      answer: قراءة النصوص بنحو مستقل عن المؤثرات والسياقات الخارجية
    - type: mcq
      question: "يصنف الدرس النقد الثقافي والنقد النسوي ضمن مدارس:"
      points: 1
      choices:
        - نصية مغلقة ترفض كل سياق خارجي
        - كلاسيكية تعنى بالحبكة ونمط السرد
        - لاحقة سياقية ترى النصوص مرآة للقضايا المجتمعية والهويات المتنازعة
        - معيارية تقيس الأعمال بمقاييس بلاغية قديمة
      answer: لاحقة سياقية ترى النصوص مرآة للقضايا المجتمعية والهويات المتنازعة
    - type: mcq
      question: "مفهوم «أفق التوقعات» يتصل في الدرس بـ:"
      points: 1
      choices:
        - النقد الجديد
        - نظرية التلقي
        - النقد البيئي
        - النقد الماركسي
      answer: نظرية التلقي
    - type: mcq
      question: "أي الإضافات النظرية يعزوها الدرس إلى النقد البيئي؟"
      points: 1
      choices:
        - تحليل البنية النفسية للمؤلف من خلال الشخصيات
        - الكشف عن علاقات الإنتاج والهيمنة داخل النص
        - إغلاق النص على نفسه وإقصاء كل ما هو خارج عنه
        - دراسة علاقة الأدب بالبيئة والطبيعة وبالتمثلات البيئية
      answer: دراسة علاقة الأدب بالبيئة والطبيعة وبالتمثلات البيئية
    - type: mcq
      question: "أي العبارات التالية يعبر عن جوهر الخلاف المنهجي بين النقد الجديد والمقاربات السياقية؟"
      points: 1
      choices:
        - الأول يفتح النص على سياقه، والثاني يغلقه على بنيته
        - الأول يعلي الذوق الفردي، والثاني يلغيه لصالح المعيار
        - الأول يعزل النص عن سياقه، والثاني يقرأه في سياقاته
        - الأول يرفض الشعر، والثاني يقتصر عليه دون السرد
      answer: الأول يعزل النص عن سياقه، والثاني يقرأه في سياقاته
    - type: mcq
      question: "في ضوء نظرية التلقي كما يعرضها الدرس، تكون وظيفة النقد:"
      points: 1
      choices:
        - جعل القارئ شريكاً فاعلاً في صياغة الدلالات وإعادة التأويل
        - إصدار حكم نهائي لا يقبل المراجعة على كل نص
        - استبدال تجربة القارئ بمعايير الناقد الأكاديمي وحده
        - حصر المعنى في نية المؤلف دون سواه من العناصر
      answer: جعل القارئ شريكاً فاعلاً في صياغة الدلالات وإعادة التأويل
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية
    - type: tf
      question: "يذهب الدرس إلى أن دراسة النقد الأدبي تنحصر في تقنيات الكتابة دون السياق الحضاري والتاريخي."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يعد التنوع المنهجي في النقد الأدبي — وفق الدرس — دليلاً على الثراء المعرفي لا على اضطراب المنهج."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "يصنف الدرس النقد النسوي ضمن مدارس النقد الكلاسيكية والتقليدية."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يقر منهج النقد الجديد بأهمية المؤثرات الاجتماعية والثقافية في بناء النصوص الأدبية."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يصف الدرس النقد بأنه سيرة تأويلية مستمرة تشمل المنتج والمستهلك على حد سواء."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "ينتهي الدرس إلى أن النقد أداة معرفية حيوية تتجاوز حدود التخصص الواحد."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح
    - type: essay
      question: "حلل الأسس التي يقوم عليها تصنيف الدرس لمدارس النقد، مبيناً المعيار الفاصل بين المدارس النصية والمدارس السياقية."
      points: 4
      answer: "1- المعيار الأول: موضع الاهتمام، فالمدارس الكلاسيكية تنظر إلى المكونات الداخلية (الحبكة، الشخصيات، نمط السرد، الأسلوب). 2- المعيار الثاني: علاقة النص بسياقه، فالنقد الجديد يعزل النص عن المؤثرات والسياقات. 3- المعيار الثالث: الوظيفة المعرفية، فالمدارس اللاحقة (الثقافي والنسوي) تجعل النص مرآة لقضايا المجتمع والهويات. 4- النتيجة: التصنيف ليس تاريخياً محضاً بل مبني على تصور كل مدرسة لعلاقة النص بغيره وبالواقع."
    - type: essay
      question: "ركّب حجة تبين كيف ينتقل النقد من مجرد الحكم على جودة النص إلى إنتاج معرفة جديدة، مستعيناً بالمنهج الاجتماعي والمنهج النفسي ونظرية التلقي."
      points: 4
      answer: "1- المنهج الاجتماعي يجعل الأدب تجسيداً للبنية المجتمعية والتحولات الثقافية، فيصير النقد قراءة للمجتمع عبر النص. 2- المنهج النفسي يقرأ دوافع الشخصيات والبنية النفسية للمؤلف، فيضيف طبقة معرفية غير مرئية في النص. 3- نظرية التلقي تُدخل القارئ شريكاً في إنتاج المعنى عبر أفق التوقعات والخلفيات الثقافية. 4- باجتماعها يتحول النقد من حكم إلى إنتاج معرفة جديدة، ومن تقييم مجرد إلى سيرة تأويلية مستمرة."
    - type: essay
      question: "قوّم الحكم القائل إن «تنوع مناهج النقد يفضي إلى فوضى منهجية»، مع بيان موقف الدرس من هذا التنوع."
      points: 4
      answer: "1- عرض الحكم: يرى أصحابه أن تعدد المناهج يبدد المعيار ويجعل الأحكام متعارضة. 2- موقف الدرس: التنوع دليل على الثراء المعرفي والخصوبة، وكل منهج يقدم رؤية تأويلية من زاوية مغايرة. 3- التقييم: الحكم يخلط بين التعدد والفوضى؛ فالفوضى غياب المنهج لا تعدد المناهج، والدرس يشترط الإلمام بالأدوات والأساليب المنهجية. 4- الحصيلة: التنوع مشروط بالانضباط المنهجي وبالوعي بحدود كل مقاربة، ومن ثم فهو قيمة معرفية لا خطر."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
