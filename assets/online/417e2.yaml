- title: "اختبار في الدرس الثاني: مفهوم النقد الأدبي ونشأة قواعده وقضاياه"
  subject-name: النقد الحديث
  subject-code: ARAB417
  questions:
    - type: instructions
      mainTitle: "أولًا: الأسئلة الموضوعية (اختيار من متعدد)"
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة وفقاً لما درسته في الدرس الثاني
    - type: mcq
      question: "ما أبرز المعاني اللغوية لكلمة «النقد» التي اعتمدها الدرس في تأسيس المفهوم الاصطلاحي؟"
      points: 1
      choices:
        - تمييز الزيف وإخراج الرديء والفحص والموازنة
        - المدح والثناء على الأعمال الجيدة
        - رواية الأخبار ونقلها عن مصادرها
        - حفظ النصوص وضبط ألفاظها وروايتها
      answer: تمييز الزيف وإخراج الرديء والفحص والموازنة
    - type: mcq
      question: "يلتقي تعريف أحمد الشايب للنقد الأدبي بالمعنى اللغوي في عنصر:"
      points: 1
      choices:
        - الحفظ والرواية والضبط
        - الفحص والتمييز وإصدار الحكم
        - الإحصاء والتصنيف الكمي
        - المقارنة بين اللغات المختلفة
      answer: الفحص والتمييز وإصدار الحكم
    - type: mcq
      question: "تتوزع دلالات تعريف الشايب الجزئية على ثلاثة عناصر هي:"
      points: 1
      choices:
        - المؤلف، والقارئ، والناشر
        - الوزن، والقافية، والصور البيانية
        - التقدير، والصحة والمنهجية، وتحديد الدرجة
        - الحفظ، والرواية، والنشر
      answer: التقدير، والصحة والمنهجية، وتحديد الدرجة
    - type: mcq
      question: "يُؤخذ على تعريف الشايب — من حيث الشمول — أنه:"
      points: 1
      choices:
        - أهمل الجانب التقويمي واقتصر على الوصف
        - رفض الاستعانة بالقواعد الفنية في التقدير
        - جعل الدرجة الأدبية تابعة لذوق القارئ وحده
        - ركّز على التقويم ولم يصرح بالوظائف التحليلية كالفهم والتفسير
      answer: ركّز على التقويم ولم يصرح بالوظائف التحليلية كالفهم والتفسير
    - type: mcq
      question: "ما الذي يضيفه التعريف الشامل المقترح على تعريف الشايب؟"
      points: 1
      choices:
        - إلغاء فكرة الدرجة الأدبية والاكتفاء بالوصف
        - إدخال الدراسة والفهم والتفسير والموازنة في صميم العملية النقدية
        - إخضاع النص لقواعد المنطق الصارم والأخلاق
        - قصر النقد على الشعر دون سائر الأجناس
      answer: إدخال الدراسة والفهم والتفسير والموازنة في صميم العملية النقدية
    - type: mcq
      question: "ما الفائدة التي يجنيها النقد من الفلسفة؟"
      points: 1
      choices:
        - إمداده بأدوات إحصائية دقيقة لقياس الجمال
        - إعفاؤه من الحاجة إلى تحليل النصوص ودراستها
        - تزويده بنظرة كلية وقواعد عامة للتفكير وأسس منطقية متماسكة
        - ربطه ببيئة الأديب الاجتماعية وظروف عصره
      answer: تزويده بنظرة كلية وقواعد عامة للتفكير وأسس منطقية متماسكة
    - type: mcq
      question: "ما الخطر الذي ينشأ من إخضاع النقد لقواعد فلسفية صارمة كالمنطق أو الأخلاق؟"
      points: 1
      choices:
        - إخضاع الفن لمعايير خارجية لا تتفق مع طبيعته الجمالية
        - إضعاف الجانب التحليلي لصالح الجانب التاريخي
        - إلغاء دور القارئ في إنتاج المعنى
        - تحويل النقد إلى مجرد إحصاء للظواهر الأسلوبية
      answer: إخضاع الفن لمعايير خارجية لا تتفق مع طبيعته الجمالية
    - type: mcq
      question: "ما المأخذ الأساسي على المناهج العلمية في دراستها للأدب؟"
      points: 1
      choices:
        - عجزها عن تفسير الظاهرة الأدبية تفسيراً خارجياً
        - افتقادها الدقة والموضوعية في أدواتها
        - رفضها الاستعانة بعلوم النفس والاجتماع والتاريخ
        - عجزها عن استيعاب العمل الفني كاملاً ونقل التجربة الجمالية
      answer: عجزها عن استيعاب العمل الفني كاملاً ونقل التجربة الجمالية
    - type: mcq
      question: "ما الخطأ المنهجي الذي يقع فيه الناقد عند خلط المقاييس بين الأجناس الأدبية؟"
      points: 1
      choices:
        - نقد القصة بمقاييس السرد والحبكة
        - نقد المسرحية بمقاييس الحوار والصراع
        - نقد الشعر الغنائي بمقاييس القصة أو الملحمة
        - نقد المقالة بمقاييس الحجة والترتيب
      answer: نقد الشعر الغنائي بمقاييس القصة أو الملحمة
    - type: mcq
      question: "كيف يصوغ الدرس الموقف المتزن في قضية علمية النقد وفنيته؟"
      points: 1
      choices:
        - النقد علم من حيث المنهج والأدوات وفن من حيث الذوق والتذوق
        - النقد علم محض لا علاقة له بالذوق الجمالي
        - النقد فن محض لا يحتاج إلى منهج ولا أدوات
        - النقد علم في الشعر وفن في النثر دون ضابط
      answer: النقد علم من حيث المنهج والأدوات وفن من حيث الذوق والتذوق
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية
    - type: tf
      question: "يقتصر المعنى اللغوي لكلمة «النقد» في المعاجم العربية على كشف عيوب النص الأدبي."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يأخذ الدارسون على تعريف الشايب تركيزه على الجانب التقويمي دون التصريح بالوظائف التحليلية."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "يعد المنتصرون لفنية النقد اختلافَ الأذواق دليلاً على موضوعية الأحكام النقدية واستقرارها."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يستدل المنادون بعلمية النقد بالإجماع الإنساني على عظمة المبدعين عبر العصور."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "تعد القواعد النقدية في الموقف المتزن قوانين صارمة تقاس بقواعد النحو في ثباتها."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "أدى وضع أرسطو قواعد مستمدة من منطق العلوم البيولوجية إلى إقصاء الشعر الغنائي من دائرة الشعر."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح
    - type: essay
      question: "حلل دلالات تعريف أحمد الشايب للنقد الأدبي، مبيناً ما يحققه من دقة وما يعتوره من قصور في الشمول، ثم اذكر ملامح التعريف المقترح لتجاوزه."
      points: 4
      answer: "1- الدلالة التقويمية: إصدار حكم تقويمي ينظر في الخصائص الذاتية للعمل. 2- دلالة الصحة والمنهجية: قيام التقدير على أصول وقواعد مشتقة من طبيعة الأدب. 3- دلالة تحديد الدرجة: بيان موقع النص في سلم الإبداع مقارنة بغيره. 4- التقييم: التعريف دقيق لأنه تقويمي يشترط الصحة ويستبعد الأحكام الانطباعية، لكنه غير شامل لأنه أهمل الدراسة والفهم والشرح والتفسير والتحليل والموازنة، ومن ثم اقترح تعريف شامل يجمع هذه الوظائف إلى التقدير وتحديد الدرجة."
    - type: essay
      question: "ركّب موقفاً يوفّق بين النزعة الذاتية والنزعة الموضوعية في قضية علمية النقد الأدبي وفنيته، مستنداً إلى حجج الطرفين وطبيعة القواعد النقدية."
      points: 4
      answer: "1- حجج الذاتية: اختلاف الأذواق وتباينها، وتغير ذوق الفرد، وعصيان الأدب على الإحصاء، وارتباطه بالشخصية والعبقرية. 2- حجج الموضوعية: تجنب الفوضى، ووجود مقاييس للجمال، والإجماع الإنساني على العظمة، ووجود أصول عامة للأنواع، وضرورة التعليل العلمي. 3- التوفيق: النقد ذو طبيعة مزدوجة، فهو علم في منهجه وأدواته وموازنته وتعليله، وفن في اعتماده على الذوق والتذوق الجمالي. 4- النتيجة: قواعد النقد مرنة للاسترشاد لا قوانين صارمة كالنحو، فيجمع بين الدقة والمتعة ويحافظ على جوهره الفني."
    - type: essay
      question: "قوّم أثر إخضاع النقد لقواعد الفلسفة من جهة، ولنظريات العلم من جهة أخرى، مبيناً مكسب كل منهما ومأخذه."
      points: 4
      answer: "1- مكسب الفلسفة: إطار فكري كلي ونظرة شاملة للكون والحياة والقيم، وقواعد عامة للتفكير، وأسس منطقية متماسكة بدل الانطباعات. 2- مأخذ الفلسفة: إخضاع الفن لمعايير خارجية كالمنطق الصارم أو الأخلاق، كما في نظر أفلاطون وأرسطو. 3- مكسب العلم: مناهج دقيقة وأدوات موضوعية تنقل النقد من التذوق الفطري إلى التفسير التعليلي عبر النفس والاجتماع والتاريخ. 4- مأخذ العلم: عجزه عن استيعاب العمل الفني كاملاً ونقل التجربة الجمالية، كما في دراسة العقاد لشعر عمر بن أبي ربيعة ودراسة الخولي لأدب المعري."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
