<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>

  <link rel="stylesheet" href="{{ '/fonts/fonts.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/design-system.css' | relative_url }}" />
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/png">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/images/cover.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">

  <script>
    (function () {
      var savedTheme = localStorage.getItem('rawafed-theme');
      document.documentElement.setAttribute(
        'data-theme',
        ['light', 'dark'].indexOf(savedTheme) !== -1 ? savedTheme : 'light'
      );
    })();
  </script>

  <style>
    .page-main {
      padding-top: var(--space-lg);
      padding-bottom: var(--space-xl);
    }

    .page-main h1 {
      margin-bottom: var(--space-md);
      color: var(--rawafid-text);
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
    }

    .page-main h2 {
      margin: var(--space-lg) 0 var(--space-sm);
      color: var(--rawafid-text);
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
    }

    .page-main p,
    .page-main li {
      color: var(--rawafid-text-muted);
      font-size: var(--text-base);
      line-height: 1.9;
    }

    .page-main ul {
      margin: var(--space-sm) 0 var(--space-md);
      padding-inline-start: 1.4rem;
    }

    .page-main a {
      color: var(--rawafid-primary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>

  {% include seo.html %}
</head>
<body>
  {% include loading.html %}
  {% include header.html %}

  <main class="page-main">
    <div class="container container--narrow">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
